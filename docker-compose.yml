services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - imladris-web
      - imladris-api
    networks:
      - imladris-edge

  imladris-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imladris}
      POSTGRES_USER: ${POSTGRES_USER:-imladris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imladris-db-password}
    volumes:
      - imladris_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imladris} -d ${POSTGRES_DB:-imladris}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - imladris-internal

  imladris-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks:
      - imladris-edge

  imladris-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      IMLADRIS_MODE: ${IMLADRIS_MODE:-local}
      AUTH_MODE: ${AUTH_MODE:-team}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32-chars}
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:-change-me-runner-secret}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-imladris}:${POSTGRES_PASSWORD:-imladris-db-password}@imladris-db:5432/${POSTGRES_DB:-imladris}}
      WORKSPACES_ROOT: /data/workspaces
      RUNNER_URL: http://imladris-runner:9000
      RUNNER_EXEC_TIMEOUT_MS: ${RUNNER_EXEC_TIMEOUT_MS:-60000}
      AI_LOCAL_URL: ${AI_LOCAL_URL:-http://imladris-ollama:11434}
      AI_ALLOW_CLOUD: ${AI_ALLOW_CLOUD:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@imladris.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrator}
    volumes:
      - imladris_workspaces:/data/workspaces
    depends_on:
      imladris-db:
        condition: service_healthy
      imladris-runner:
        condition: service_started
    networks:
      - imladris-edge
      - imladris-internal

  imladris-runner:
    build:
      context: .
      dockerfile: services/runner/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: "2.0"
    environment:
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:-change-me-runner-secret}
      WORKSPACES_ROOT: /data/workspaces
    volumes:
      - imladris_workspaces:/data/workspaces
    networks:
      - imladris-internal

networks:
  imladris-edge:
    driver: bridge
  imladris-internal:
    driver: bridge
    internal: true

volumes:
  imladris_pgdata:
  imladris_workspaces:
