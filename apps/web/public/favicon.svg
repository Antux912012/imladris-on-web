<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Imladris on Web">
  <defs>
    <linearGradient id="meshBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17384e" />
      <stop offset="55%" stop-color="#1d4463" />
      <stop offset="100%" stop-color="#202a54" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#53339e" />
      <stop offset="100%" stop-color="#3c2378" />
    </linearGradient>
  </defs>

  <!-- Left half: low-poly faceted crystal (transparent background) -->
  <g stroke="#d7ecf9" stroke-width="1" stroke-linejoin="round">
    <!-- Top apex white facet -->
    <polygon points="248,64 130,124 184,176" fill="#f2f8fc" />
    <!-- Top-center light ice-blue facet -->
    <polygon points="248,64 184,176 248,176" fill="#cae7f8" />
    <!-- Upper-left white facet -->
    <polygon points="130,124 72,248 184,176" fill="#f7fbfe" />
    <!-- Mid-upper inner facet -->
    <polygon points="184,176 72,248 184,256" fill="#d9eefb" />
    <!-- Center-upper facet behind badge -->
    <polygon points="184,176 248,176 248,256 184,256" fill="#bde0f6" />
    <!-- Lower-left bright purple facet -->
    <polygon points="72,248 184,256 176,336 122,382" fill="#5e3ea8" />
    <!-- Lower-left deep purple shadow facet -->
    <polygon points="122,382 176,336 196,368" fill="#3a2373" />
    <!-- Center-lower ice facet -->
    <polygon points="184,256 248,256 248,358 176,336" fill="#eaf5fc" />
    <!-- Bottom-left sky blue facet -->
    <polygon points="122,382 196,368 248,448" fill="#77b6df" />
    <!-- Bottom-center sky blue facet -->
    <polygon points="176,336 248,358 248,448 196,368" fill="#a2d3f0" />
  </g>

  <!-- Right half: geometric wireframe network over translucent deep-teal polyhedron -->
  <g>
    <polygon
      points="264,64 348,86 414,146 446,224 440,308 396,384 324,434 264,448"
      fill="url(#meshBg)"
      stroke="#7ac2ed"
      stroke-width="6"
      stroke-linejoin="round"
    />

    <!-- Wireframe edges -->
    <g stroke="#72b9e6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Outer-to-inner connections -->
      <line x1="264" y1="64" x2="310" y2="128" />
      <line x1="348" y1="86" x2="310" y2="128" />
      <line x1="348" y1="86" x2="372" y2="168" />
      <line x1="414" y1="146" x2="372" y2="168" />
      <line x1="414" y1="146" x2="394" y2="236" />
      <line x1="446" y1="224" x2="394" y2="236" />
      <line x1="446" y1="224" x2="386" y2="306" />
      <line x1="440" y1="308" x2="386" y2="306" />
      <line x1="440" y1="308" x2="358" y2="366" />
      <line x1="396" y1="384" x2="358" y2="366" />
      <line x1="396" y1="384" x2="306" y2="392" />
      <line x1="324" y1="434" x2="306" y2="392" />
      <line x1="264" y1="448" x2="306" y2="392" />

      <!-- Internal mesh triangles -->
      <line x1="264" y1="148" x2="310" y2="128" />
      <line x1="264" y1="148" x2="322" y2="212" />
      <line x1="310" y1="128" x2="372" y2="168" />
      <line x1="310" y1="128" x2="322" y2="212" />
      <line x1="372" y1="168" x2="322" y2="212" />
      <line x1="372" y1="168" x2="394" y2="236" />
      <line x1="322" y1="212" x2="394" y2="236" />
      <line x1="322" y1="212" x2="264" y2="212" />
      <line x1="322" y1="212" x2="326" y2="294" />
      <line x1="394" y1="236" x2="386" y2="306" />
      <line x1="394" y1="236" x2="326" y2="294" />
      <line x1="326" y1="294" x2="386" y2="306" />
      <line x1="326" y1="294" x2="264" y2="306" />
      <line x1="326" y1="294" x2="358" y2="366" />
      <line x1="326" y1="294" x2="306" y2="392" />
      <line x1="386" y1="306" x2="358" y2="366" />
      <line x1="358" y1="366" x2="306" y2="392" />
      <line x1="264" y1="372" x2="306" y2="392" />
    </g>

    <!-- Mesh vertex nodes -->
    <g fill="#9cd7f7">
      <circle cx="348" cy="86" r="6" />
      <circle cx="414" cy="146" r="6" />
      <circle cx="446" cy="224" r="6" />
      <circle cx="440" cy="308" r="6" />
      <circle cx="396" cy="384" r="6" />
      <circle cx="324" cy="434" r="6" />
      <circle cx="310" cy="128" r="7" />
      <circle cx="372" cy="168" r="7" />
      <circle cx="322" cy="212" r="7" />
      <circle cx="394" cy="236" r="7" />
      <circle cx="326" cy="294" r="7" />
      <circle cx="386" cy="306" r="7" />
      <circle cx="358" cy="366" r="7" />
      <circle cx="306" cy="392" r="7" />
    </g>
  </g>

  <!-- Center purple badge with { } -->
  <circle cx="256" cy="256" r="56" fill="url(#badgeGrad)" stroke="#7cc2ec" stroke-width="2.5" stroke-opacity="0.45" />
  <g fill="#ffffff">
    <!-- Left brace { -->
    <path d="M244 226 C234 226 230 231 230 239 L230 247 C230 252 227 255 222 256 C227 257 230 260 230 265 L230 273 C230 281 234 286 244 286 L246 286 L246 279 L244 279 C239 279 238 276 238 271 L238 264 C238 259 235 257 232 256 C235 255 238 253 238 248 L238 241 C238 236 239 233 244 233 L246 233 L246 226 Z" />
    <!-- Right brace } -->
    <path d="M268 226 C278 226 282 231 282 239 L282 247 C282 252 285 255 290 256 C285 257 282 260 282 265 L282 273 C282 281 278 286 268 286 L266 286 L266 279 L268 279 C273 279 274 276 274 271 L274 264 C274 259 277 257 280 256 C277 255 274 253 274 248 L274 241 C274 236 273 233 268 233 L266 233 L266 226 Z" />
  </g>
</svg>
