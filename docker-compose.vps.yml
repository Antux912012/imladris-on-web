services:
  proxy:
    ports:
      - "80:80"
      - "443:443"
    environment:
      IMLADRIS_SITE: ${IMLADRIS_DOMAIN:-imladris.example.org}

  imladris-ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - imladris-internal

volumes:
  ollama_models:
